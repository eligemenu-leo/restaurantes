# Recompila cada web en Cloudflare Pages cada hora para que los cambios de carta
# hechos en Eligemenú lleguen solos. Cada web tiene su propio deploy hook
# (secretos CF_HOOK_SIDRERIA y CF_HOOK_LAVACA): si falta uno, esa web se salta.
name: Recompilar cartas de Eligemenú

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  recompilar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - web: sidreria-villaviciosa
            hook: CF_HOOK_SIDRERIA
          - web: la-vaca-asustada
            hook: CF_HOOK_LAVACA
    steps:
      - name: Lanzar compilación de ${{ matrix.web }}
        env:
          HOOK: ${{ secrets[matrix.hook] }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Sin secreto ${{ matrix.hook }}: no se recompila ${{ matrix.web }}."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Compilación de ${{ matrix.web }} lanzada."
