                if (e.key === 'Escape') {
                    const openPanels = document.querySelectorAll('[aria-expanded="true"]');
                    openPanels.forEach(function(panel) {
                        panel.setAttribute('aria-expanded', 'false');
                        const target = document.getElementById(panel.getAttribute('aria-controls'));
                        if (target) {
                            target.hidden = true;
                        }

                if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                    const focused = document.activeElement;
                    if (focused.hasAttribute('role') && focused.getAttribute('role') === 'button') {
                        e.preventDefault();
                        const buttons = Array.from(document.querySelectorAll('[role="button"]'));
                        const currentIndex = buttons.indexOf(focused);
                        const nextIndex = e.key === 'ArrowDown' ? currentIndex + 1 : currentIndex - 1;
                        if (buttons[nextIndex]) {
                            buttons[nextIndex].focus();
                        }
                    }

                if (e.key === 'Tab') {
